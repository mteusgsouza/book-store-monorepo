name: Migrate Database

on:
  push:
    branches:
      - main
    paths:
      - "packages/prisma/migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @workspace/database --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @workspace/database db:migrate:deploy
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
          DATABASE_SHADOW_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
